
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | IFAgendas</title>

    <link rel="stylesheet" href="login.css">
</head>

<body class="pagina-login">

    <main class="container">

        <!-- LADO ESQUERDO -->
        <section class="lado-esquerdo">

            <!-- BARRA SUPERIOR -->
            <div class="pesquisa">
                <span class="lupa">⌕</span>
                <input type="text" aria-label="Pesquisa">
            </div>

            <!-- DECORAÇÃO SUPERIOR -->
            <div class="folha folha-1"></div>
            <div class="folha folha-2"></div>

            <!-- LOGO -->
            <div class="logo">

                <img src="img/logo.png" alt="Logo IFAgendas">

                <h1>IFAgendas</h1>

            </div>

            <!-- LIVROS -->
            <div class="ilustracao">

                <img src="img/livros.png" alt="Ilustração de livros">

            </div>

        </section>


        <!-- LADO DIREITO -->
        <section class="lado-direito">

            <!-- DECORAÇÕES -->
            <div class="decoracao decoracao-topo"></div>
            <div class="decoracao decoracao-lateral"></div>
            <div class="decoracao decoracao-baixo"></div>


            <!-- CAIXA DE LOGIN -->
            <div class="login-box">

                <h2>Bem-vindo(a)!</h2>

                <p class="subtitulo">
                    Faça login para acessar sua agenda.
                </p>


                <form action="index.html" method="GET">

                    <!-- USUÁRIO -->
                    <div class="campo">

                        <span class="icone usuario-icone">♙</span>

                        <input
                            type="text"
                            name="usuario"
                            placeholder="Usuário"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <!-- SENHA -->
                    <div class="campo">

                        <span class="icone cadeado">♙</span>

                        <input
                            type="password"
                            name="senha"
                            placeholder="Senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <!-- ENTRAR -->
                    <button type="submit" class="btn-entrar">
                        Entrar
                    </button>

                </form>


                <!-- DIVISOR -->
                <div class="divisor">

                    <span></span>

                    <p>ou</p>

                    <span></span>

                </div>


                <!-- GOOGLE -->
                <button type="button" class="btn-google">

                    <strong>G</strong>
                    Entrar com o Google

                </button>


                <!-- ESQUECEU SENHA -->
                <a href="#" class="esqueceu">
                    Esqueceu a sua senha?
                </a>

            </div>

        </section>

    </main>

</body>

</html>
